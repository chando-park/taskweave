<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskweave · Workplan</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.mjs"></script></head>
<body><header class="topbar"><a class="brand" href="/">Taskweave<span>WORKPLAN LIBRARY</span></a><span class="readonly">로컬 · 조회 전용</span><button id="refresh" type="button">새로 읽기</button></header>
<main class="workspace"><section class="intro"><div><p class="eyebrow">작업의 맥락을 한곳에서</p><h1>기록을 찾고, 흐름을 읽어요.</h1><p>계획부터 코드와 검증까지. 원본은 그대로, 읽기는 편안하게.</p></div><div class="intro-mark" aria-hidden="true">↗</div></section>
<form id="filters" class="filters" aria-label="작업 검색과 필터"><label class="search">키워드<input name="q" type="search" placeholder="제목, Jira 번호, 코드 이름 검색" autocomplete="off"></label><label>프로젝트<select name="project"><option value="">모든 프로젝트</option></select></label><label>원문 상태<select name="status"><option value="">모든 상태</option></select></label><label>시작일<input name="from" type="date"></label><label>종료일<input name="to" type="date"></label><button type="submit">검색</button></form>
<div id="notice" class="notice" role="status" aria-live="polite"></div><div class="panes"><aside class="library" aria-label="최근 작업 목록"><div class="section-heading"><h2>최근 작업</h2><span id="count"></span></div><div id="list" aria-live="polite"></div><button id="more" class="more" hidden>다음 20건 읽기</button></aside><section class="detail" aria-label="선택한 작업"><div id="detail-state" class="placeholder"><span aria-hidden="true">◫</span><h2>작업을 선택해 주세요</h2><p>계획, 구현 설명, 흐름도와 테스트 기록을 이곳에서 읽을 수 있어요.</p></div><div id="detail-content" hidden><header id="workplan-heading"></header><nav id="tabs" class="tabs" aria-label="작업 자료 영역"></nav><div id="documents" class="document-links" aria-label="연결된 자료"></div><div id="document-notice" class="notice" role="status"></div><article id="article" class="markdown"></article><iframe id="flow" title="격리된 코드 흐름도" sandbox="allow-scripts" hidden></iframe><details id="source" class="source"><summary>원문 텍스트 보기</summary><pre></pre></details></div></section></div><footer>명시한 기록 폴더만 읽습니다. 검색은 읽은 Markdown 본문에 한정되며 상태·검증 결과를 추정하지 않습니다.</footer></main></body></html>
